server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: all paths → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html names the hashed bundle of this version: browsers revalidate
    # it on every load, or after an upgrade they keep starting the previous
    # bundle, whose files are gone.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Health check
    location /healthz {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
