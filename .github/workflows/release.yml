# Builds, checks, publishes and signs the VorPilot Server images and Helm charts.
#
# Release: a tag v<version> or v<version>-beta pushed onto a commit of main.
# A release of the same name must already exist as a draft carrying the
# pre-built artifacts and chart packages. The build job builds the images from
# those artifacts, checks images and charts (a chart of version X runs the
# images tagged X) and keeps the checked result as an artifact of the run. The
# release job publishes exactly that result: it pushes images and charts to
# ghcr.io/vortilis, signs them keyless, attests their provenance and only then
# publishes the release.
#
# The two jobs are split so that a release job that fails after publishing can
# be finished with "Re-run failed jobs": the rerun takes the same checked
# images instead of building new ones, finds them and their signatures already
# published, and goes on with what is missing. "Re-run all jobs" builds new
# images, and publishing then refuses them: a published version is never
# overwritten.
#
# Rehearsal: run this workflow by hand from main with the draft's tag. It runs
# the build job and checks that its result reaches a later job unchanged; it
# publishes nothing.
#
# Nothing else runs it: no branch pushes, no pull requests, no forks.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Draft release to rehearse, e.g. v0.6.0-beta. Builds and checks; never publishes.
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/vortilis
  TRIVY_VERSION: v0.75.0
  COSIGN_VERSION: v3.1.3
  REGCTL_VERSION: v0.11.6
  # Installed from get.helm.sh and checked against this sha256 (linux-amd64).
  HELM_VERSION: v3.22.0
  HELM_SHA256: 1e4ab49e429626cf6c6958d914248b78c9730803c2751b87627e171dc800e7bb
  # The checked images, charts and release record, handed from build to the
  # job that publishes them.
  RESULT_ARTIFACT: server-release

jobs:
  build:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write # a draft release is visible only with write access; nothing is written
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse a tag outside main
        if: github.event_name == 'push'
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$RELEASE_TAG points at $GITHUB_SHA, which is not on main"; exit 1; }
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}
          cache: true
      - name: Install Helm
        run: |
          curl -fsSLo "$RUNNER_TEMP/helm.tar.gz" "https://get.helm.sh/helm-$HELM_VERSION-linux-amd64.tar.gz"
          echo "$HELM_SHA256  $RUNNER_TEMP/helm.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/helm.tar.gz" -C "$RUNNER_TEMP" linux-amd64/helm
          sudo install -m 0755 "$RUNNER_TEMP/linux-amd64/helm" /usr/local/bin/helm
      - name: Build and check
        run: >-
          tools/prepare-release.sh --repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG"
          --revision "$GITHUB_SHA" --work work --docker-dir docker --ignorefile trivyignore.yaml
          --registry "$REGISTRY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.RESULT_ARTIFACT }}
          path: work/server
          if-no-files-found: error
          retention-days: 1
          compression-level: 0 # image layers are compressed already

  rehearse:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.RESULT_ARTIFACT }}
          path: work/server
      - name: Check the handed-over result
        run: python3 tools/release_checks.py check-publishable --dir work/server --tag "${RELEASE_TAG#v}"

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write # read the draft, publish it
      packages: write # push to ghcr.io/vortilis
      id-token: write # keyless signing and attestations
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse a tag outside main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$RELEASE_TAG points at $GITHUB_SHA, which is not on main"; exit 1; }
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - uses: regclient/actions/regctl-installer@1b705e32d40851370799ea5814e83d0a5f6a70dc # v0.1.0
        with:
          release: ${{ env.REGCTL_VERSION }}
      - name: Install Helm
        run: |
          curl -fsSLo "$RUNNER_TEMP/helm.tar.gz" "https://get.helm.sh/helm-$HELM_VERSION-linux-amd64.tar.gz"
          echo "$HELM_SHA256  $RUNNER_TEMP/helm.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/helm.tar.gz" -C "$RUNNER_TEMP" linux-amd64/helm
          sudo install -m 0755 "$RUNNER_TEMP/linux-amd64/helm" /usr/local/bin/helm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.RESULT_ARTIFACT }}
          path: work/server
      - name: Log in to GHCR
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          echo "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish and sign
        id: publish
        run: |
          tools/publish-server-release.sh --dir work/server --tag "${RELEASE_TAG#v}" \
            --registry "$REGISTRY" --identity "$GITHUB_SERVER_URL/$GITHUB_WORKFLOW_REF"
          cat work/server/digests.env >>"$GITHUB_OUTPUT"
      # Each attestation gets a second attempt: obtaining the OIDC token can
      # time out for a moment, and everything is already published by then.
      - id: attest-scout
        continue-on-error: true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/vorpilot-scout
          subject-digest: ${{ steps.publish.outputs.SCOUT_DIGEST }}
          push-to-registry: true
      - if: steps.attest-scout.outcome == 'failure'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/vorpilot-scout
          subject-digest: ${{ steps.publish.outputs.SCOUT_DIGEST }}
          push-to-registry: true
      - id: attest-frontend
        continue-on-error: true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/vorpilot-frontend
          subject-digest: ${{ steps.publish.outputs.FRONTEND_DIGEST }}
          push-to-registry: true
      - if: steps.attest-frontend.outcome == 'failure'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/vorpilot-frontend
          subject-digest: ${{ steps.publish.outputs.FRONTEND_DIGEST }}
          push-to-registry: true
      - id: attest-server-chart
        continue-on-error: true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/charts/vorpilot-server
          subject-digest: ${{ steps.publish.outputs.SERVER_CHART_DIGEST }}
          push-to-registry: true
      - if: steps.attest-server-chart.outcome == 'failure'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/charts/vorpilot-server
          subject-digest: ${{ steps.publish.outputs.SERVER_CHART_DIGEST }}
          push-to-registry: true
      - id: attest-agent-chart
        continue-on-error: true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/charts/vorpilot-agent
          subject-digest: ${{ steps.publish.outputs.AGENT_CHART_DIGEST }}
          push-to-registry: true
      - if: steps.attest-agent-chart.outcome == 'failure'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/charts/vorpilot-agent
          subject-digest: ${{ steps.publish.outputs.AGENT_CHART_DIGEST }}
          push-to-registry: true
      - id: attest-rbac-bootstrap-chart
        continue-on-error: true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/charts/vorpilot-rbac-bootstrap
          subject-digest: ${{ steps.publish.outputs.RBAC_BOOTSTRAP_CHART_DIGEST }}
          push-to-registry: true
      - if: steps.attest-rbac-bootstrap-chart.outcome == 'failure'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/charts/vorpilot-rbac-bootstrap
          subject-digest: ${{ steps.publish.outputs.RBAC_BOOTSTRAP_CHART_DIGEST }}
          push-to-registry: true
      - name: Publish the release
        run: |
          gh release upload "$RELEASE_TAG" work/server/images.txt --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$RELEASE_TAG" --draft=false --repo "$GITHUB_REPOSITORY"
