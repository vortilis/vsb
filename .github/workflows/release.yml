# Builds, checks, publishes and signs the VorPilot Server images.
#
# Release: a tag v<version> or v<version>-beta pushed onto a commit of main.
# A release of the same name must already exist as a draft carrying the
# pre-built artifacts. The job builds the images from those artifacts, checks
# them, pushes them to ghcr.io/vortilis, signs them keyless, attests their
# provenance and only then publishes the release.
#
# Rehearsal: run this workflow by hand from main with the draft's tag. It does
# everything up to and including the checks and publishes nothing.
#
# Nothing else runs it: no branch pushes, no pull requests, no forks.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Draft release to rehearse, e.g. v0.6.0-beta. Builds and checks; never publishes.
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/vortilis
  TRIVY_VERSION: v0.75.0
  COSIGN_VERSION: v3.1.3
  REGCTL_VERSION: v0.11.6

jobs:
  rehearse:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write # a draft release is visible only with write access; nothing is written
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}
          cache: true
      - name: Build and check
        run: >-
          tools/prepare-release.sh --repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG"
          --revision "$GITHUB_SHA" --work work --docker-dir docker --ignorefile trivyignore.yaml

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write # read the draft, publish it
      packages: write # push to ghcr.io/vortilis
      id-token: write # keyless signing and attestations
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse a tag outside main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$RELEASE_TAG points at $GITHUB_SHA, which is not on main"; exit 1; }
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}
          cache: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - uses: regclient/actions/regctl-installer@1b705e32d40851370799ea5814e83d0a5f6a70dc # v0.1.0
        with:
          release: ${{ env.REGCTL_VERSION }}
      - name: Build and check
        run: >-
          tools/prepare-release.sh --repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG"
          --revision "$GITHUB_SHA" --work work --docker-dir docker --ignorefile trivyignore.yaml
      - name: Log in to GHCR
        run: echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish and sign
        id: publish
        run: |
          tools/publish-server-images.sh --dir work/server --tag "${RELEASE_TAG#v}" \
            --registry "$REGISTRY" --identity "$GITHUB_SERVER_URL/$GITHUB_WORKFLOW_REF"
          cat work/server/digests.env >>"$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/vorpilot-scout
          subject-digest: ${{ steps.publish.outputs.SCOUT_DIGEST }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/vorpilot-frontend
          subject-digest: ${{ steps.publish.outputs.FRONTEND_DIGEST }}
          push-to-registry: true
      - name: Publish the release
        run: |
          gh release upload "$RELEASE_TAG" work/server/images.txt --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$RELEASE_TAG" --draft=false --repo "$GITHUB_REPOSITORY"
